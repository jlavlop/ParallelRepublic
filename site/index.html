<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repúblicas Paralelas</title>
<meta name="description" content="Funda una república a lo largo de un paralelo y descubre qué ciudades, países y artistas comparten tu latitud.">
<meta property="og:title" content="Repúblicas Paralelas">
<meta property="og:description" content="Funda una república a lo largo de un paralelo y descubre quién comparte tu latitud.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23dbe6eb' stroke='%2315242d' stroke-width='2'/%3E%3Crect x='2' y='13' width='28' height='6' fill='%23e8590c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,500&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Repúblicas <span>Paralelas</span></h1>
    <p id="tagline"></p>
  </div>
  <div class="tools">
    <div class="seg" role="group" id="viewSeg">
      <button type="button" data-view="flat" aria-pressed="true" id="vFlat"></button>
      <button type="button" data-view="globe" aria-pressed="false" id="vGlobe"></button>
    </div>
    <div class="seg" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button class="btn" id="surprise" type="button"></button>
  </div>
</header>

<main class="app">
  <section class="mapwrap" id="mapwrap">
    <div id="map"></div>
    <div class="zoom">
      <button type="button" id="zin">+</button>
      <button type="button" id="zout">−</button>
      <button type="button" id="zfit">⟲</button>
    </div>
    <div class="status" id="status"></div>
    <div class="readout" id="readout"></div>
  </section>

  <aside class="panel">
    <section class="sec">
      <label class="eyebrow" for="q" id="lSearch"></label>
      <div class="search">
        <input class="field" id="q" type="search" autocomplete="off">
        <ul class="sugg" id="sugg" hidden></ul>
      </div>
      <div id="cityCard"></div>
    </section>

    <section class="sec">
      <div class="sec-head"><h2 class="eyebrow" id="lReps"></h2><button class="btn sm" id="addRep" type="button"></button></div>
      <ul class="reps" id="repList"></ul>
      <div id="repDetail"></div>
    </section>

    <section class="sec">
      <h2 class="eyebrow" id="lPlaces"></h2>
      <form class="add" id="placeForm">
        <input class="field" id="pName" required>
        <input class="field mono" id="pCoord" placeholder="42.39, -8.70" required>
        <button class="btn primary" type="submit" id="pAdd"></button>
      </form>
      <p class="empty" id="pMsg"></p>
      <ul class="rows" id="placeList"></ul>
    </section>

    <p class="foot" id="foot"></p>
  </aside>
</main>

<dialog class="cardlg" id="cardDlg">
  <div class="cardbox">
    <canvas id="cardCv" width="1080" height="1350"></canvas>
    <div class="actions">
      <button class="btn" type="button" id="cardClose"></button>
      <button class="btn primary" type="button" id="cardSave"></button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
